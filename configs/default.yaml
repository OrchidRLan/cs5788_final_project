model:
  pretrained: "VAST-AI/TripoSG"
  freeze_vae: true          # freeze VAE encoder/decoder
  lora_rank: 16             # LoRA rank for DiT cross-attention
  lora_alpha: 32

training:
  output_dir: "checkpoints"
  num_steps: 3000
  batch_size: 1
  gradient_accumulation_steps: 4   # effective batch = 4
  learning_rate: 1.0e-5
  weight_decay: 1.0e-4
  lr_scheduler: "cosine"
  warmup_steps: 100
  save_every: 500
  log_every: 50
  mixed_precision: "fp16"          # saves VRAM on RTX 5070
  gradient_clip: 1.0
  seed: 42

loss:
  lambda_normal: 0.1
  lambda_eikonal: 0.05
  n_sample_points: 512             # reduce if OOM, increase for quality

data:
  train_dir: "data/train"
  test_dir: "data/test"
  image_size: 512
  num_workers: 2

eval:
  clip_model: "ViT-L/14"
